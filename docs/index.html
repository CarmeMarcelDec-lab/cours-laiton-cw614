<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baromètre Matières - Carme Marcel Décolletage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B0F17;
      color: #F8FAFC;
      padding: 24px;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid #1E293B;
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #F8FAFC;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #64748B;
      margin-top: 4px;
    }
    .last-updated {
      font-size: 0.8125rem;
      color: #94A3B8;
      background: #1E293B;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }
    /* Couleurs des bordures de cartes selon ISO 513 */
    .card.steel::before { background-color: #2563EB; } /* ISO P - Bleu (Acier) */
    .card.inox::before { background-color: #EAB308; }  /* ISO M - Jaune (Inox) */
    .card.alu::before { background-color: #10B981; }   /* ISO N - Vert (Alu) */
    .card.brass::before { background-color: #F59E0B; } /* ISO N - Ambre (Laiton) */

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #94A3B8;
    }
    .iso-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .badge-p { background: rgba(37, 99, 235, 0.2); color: #60A5FA; }
    .badge-m { background: rgba(234, 179, 8, 0.2); color: #FDE047; }
    .badge-n { background: rgba(16, 185, 129, 0.2); color: #34D399; }
    .badge-brass { background: rgba(245, 158, 11, 0.2); color: #FBBF24; }

    .price {
      font-size: 1.5rem;
      font-weight: 700;
      color: #F8FAFC;
    }
    .unit {
      font-size: 0.875rem;
      font-weight: 400;
      color: #64748B;
    }
    .trend {
      font-size: 0.8125rem;
      font-weight: 600;
      margin-top: 6px;
      display: inline-block;
    }
    .trend.up { color: #EF4444; }
    .trend.down { color: #10B981; }
    .trend.neutral { color: #64748B; }

    .chart-container {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 20px;
    }
    .chart-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #F8FAFC;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Baromètre Cours des Matières Premières</h1>
        <p class="subtitle">Carme Marcel Décolletage - Classification ISO 513</p>
      </div>
      <div id="lastUpdated" class="last-updated">Mise à jour : --</div>
    </header>

    <div class="grid">
      <div class="card steel">
        <div class="card-header">
          <span class="card-title">Acier S300PB</span>
          <span class="iso-badge badge-p">ISO P</span>
        </div>
        <div class="price" id="price-steel">-- <span class="unit">€/kg</span></div>
        <div class="trend" id="trend-steel">--</div>
      </div>

      <div class="card inox">
        <div class="card-header">
          <span class="card-title">Inox 303</span>
          <span class="iso-badge badge-m">ISO M</span>
        </div>
        <div class="price" id="price-inox">-- <span class="unit">€/kg</span></div>
        <div class="trend" id="trend-inox">--</div>
      </div>

      <div class="card alu">
        <div class="card-header">
          <span class="card-title">Alu 2017A</span>
          <span class="iso-badge badge-n">ISO N</span>
        </div>
        <div class="price" id="price-alu">-- <span class="unit">€/kg</span></div>
        <div class="trend" id="trend-alu">--</div>
      </div>

      <div class="card brass">
        <div class="card-header">
          <span class="card-title">Laiton CW614N</span>
          <span class="iso-badge badge-brass">ISO N</span>
        </div>
        <div class="price" id="price-brass">-- <span class="unit">€/kg</span></div>
        <div class="trend" id="trend-brass">--</div>
      </div>
    </div>

    <div class="chart-container">
      <h2 class="chart-title">Évolution des prix (€/kg)</h2>
      <canvas id="multiChart" height="110"></canvas>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        const data = await response.json();
        
        if (!data || !data.history || data.history.length === 0) return;

        const latest = data.history[data.history.length - 1];
        const previous = data.history.length > 1 ? data.history[data.history.length - 2] : latest;

        // Date de mise à jour
        document.getElementById('lastUpdated').innerText = 'Mise à jour : ' + (data.last_updated || latest.date);

        // Mise à jour des cartes
        updateCard('steel', latest.s300pb, previous.s300pb);
        updateCard('inox', latest.inox303, previous.inox303);
        updateCard('alu', latest.alu2017, previous.alu2017);
        updateCard('brass', latest.brass, previous.brass);

        // Graphique
        renderChart(data.history);
      } catch (e) {
        console.error('Erreur lors du chargement des données:', e);
      }
    }

    function updateCard(id, current, prev) {
      if (current === undefined) return;
      document.getElementById(`price-${id}`).innerHTML = `${current.toFixed(2)} <span class="unit">€/kg</span>`;
      
      const diff = current - prev;
      const pct = prev > 0 ? ((diff / prev) * 100).toFixed(1) : 0;
      const trendEl = document.getElementById(`trend-${id}`);

      if (diff > 0) {
        trendEl.className = 'trend up';
        trendEl.innerText = `▲ +${diff.toFixed(2)} € (+${pct}%)`;
      } else if (diff < 0) {
        trendEl.className = 'trend down';
        trendEl.innerText = `▼ ${diff.toFixed(2)} € (${pct}%)`;
      } else {
        trendEl.className = 'trend neutral';
        trendEl.innerText = '= Égal';
      }
    }

    function renderChart(history) {
      const labels = history.map(item => item.date);
      const ctx = document.getElementById('multiChart').getContext('2d');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Acier S300PB (ISO P)',
              data: history.map(i => i.s300pb),
              borderColor: '#2563EB', // BLEU ISO 513 (Groupe P - Aciers)
              backgroundColor: 'rgba(37, 99, 235, 0.1)',
              borderWidth: 2,
              pointRadius: 3,
              tension: 0.2
            },
            {
              label: 'Inox 303 (ISO M)',
              data: history.map(i => i.inox303),
              borderColor: '#EAB308', // JAUNE ISO 513 (Groupe M - Inox)
              backgroundColor: 'rgba(234, 179, 8, 0.1)',
              borderWidth: 2,
              pointRadius: 3,
              tension: 0.2
            },
            {
              label: 'Alu 2017A (ISO N)',
              data: history.map(i => i.alu2017),
              borderColor: '#10B981', // VERT ISO 513 (Groupe N - Non ferreux)
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              borderWidth: 2,
              pointRadius: 3,
              tension: 0.2
            },
            {
              label: 'Laiton CW614N (ISO N)',
              data: history.map(i => i.brass),
              borderColor: '#F59E0B', // AMBRE / LAITON (Dérivé Groupe N)
              backgroundColor: 'rgba(245, 158, 11, 0.1)',
              borderWidth: 2,
              pointRadius: 3,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: '#94A3B8',
                font: { family: 'Inter', size: 12 }
              }
            },
            tooltip: {
              backgroundColor: '#0F172A',
              titleColor: '#F8FAFC',
              bodyColor: '#CBD5E1',
              borderColor: '#1E293B',
              borderWidth: 1,
              padding: 10
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(30, 41, 59, 0.5)' },
              ticks: { color: '#64748B', font: { family: 'Inter', size: 11 } }
            },
            y: {
              grid: { color: 'rgba(30, 41, 59, 0.5)' },
              ticks: { 
                color: '#64748B', 
                font: { family: 'Inter', size: 11 },
                callback: function(value) { return value + ' €'; }
              }
            }
          }
        }
      });
    }

    loadData();
  </script>
</body>
</html>
