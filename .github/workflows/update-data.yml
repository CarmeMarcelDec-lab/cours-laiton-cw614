name: Update Brass Price Data

on:
  schedule:
    # S'exécute du lundi au vendredi à 18h00 UTC
    - cron: '0 5 * * 1-5'
  workflow_dispatch: # Permet le déclenchement manuel

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assurer l'existence du dossier docs
        run: mkdir -p docs

      - name: Récupération des données via l'API
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node fetch-data.js

      - name: Commit et Push du fichier data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "chore: mise à jour automatique des cours" || exit 0
          git push
