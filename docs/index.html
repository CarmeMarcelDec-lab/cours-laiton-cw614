<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indicateur Matières Décolletage</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; padding: 20px; display: flex; justify-content: center; }
    .dashboard { max-width: 900px; width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 20px 0; }
    .card { background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .card-title { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
    .card-value { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
    .chart-container { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="dashboard">
    <h2>Baromètre Matières Décolletage (€/kg)</h2>
    <p id="update-date" style="color: #64748b; font-size: 0.85rem;">Mise à jour...</p>

    <div class="grid">
      <div class="card" style="border-left: 4px solid #d97706;">
        <div class="card-title">Laiton CW614N</div>
        <div class="card-value" id="brass-val">-- €</div>
      </div>
      <div class="card" style="border-left: 4px solid #2563eb;">
        <div class="card-title">Alu 2017A</div>
        <div class="card-value" id="alu-val">-- €</div>
      </div>
      <div class="card" style="border-left: 4px solid #059669;">
        <div class="card-title">Inox 303 (1.4305)</div>
        <div class="card-value" id="inox-val">-- €</div>
      </div>
      <div class="card" style="border-left: 4px solid #475569;">
        <div class="card-title">Acier S300PB</div>
        <div class="card-value" id="steel-val">-- €</div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="multiChart" height="200"></canvas>
    </div>
  </div>

  <script>
    fetch('./data.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('brass-val').innerText = `${data.current.brass_cw614_eur_kg} €`;
        document.getElementById('alu-val').innerText = `${data.current.alu_2017_eur_kg} €`;
        document.getElementById('inox-val').innerText = `${data.current.inox_303_eur_kg} €`;
        document.getElementById('steel-val').innerText = `${data.current.steel_s300pb_eur_kg} €`;

        document.getElementById('update-date').innerText = `Dernière mise à jour : ${new Date(data.last_updated).toLocaleString('fr-FR')}`;

        const history = data.history || [];
        const labels = history.map(i => i.date);

        new Chart(document.getElementById('multiChart').getContext('2d'), {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: 'Laiton CW614N', data: history.map(i => i.brass), borderColor: '#d97706', tension: 0.2 },
              { label: 'Alu 2017A', data: history.map(i => i.alu2017), borderColor: '#2563eb', tension: 0.2 },
              { label: 'Inox 303', data: history.map(i => i.inox303), borderColor: '#059669', tension: 0.2 },
              { label: 'Acier S300PB', data: history.map(i => i.s300pb), borderColor: '#475569', tension: 0.2 }
            ]
          },
          options: { responsive: true }
        });
      });
  </script>
</body>
</html>
